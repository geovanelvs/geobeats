{% extends 'music/base.html' %} 

{% block content %}
<div class="row justify-content-center align-items-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg p-5 text-center">
            
            <i class="bi bi-exclamation-circle text-danger mb-3" style="font-size: 3.5rem; color: #ff4444 !important;"></i>
            
            <h2 class="fw-bold mb-3 text-white">Excluir Playlist</h2>
            
            <p class="mb-4" style="color: #b3b3b3; font-size: 1.1rem;">
                Você tem certeza que deseja apagar a playlist <br>
                <strong class="text-white" style="font-size: 1.3rem;">"{{ playlist.nome }}"</strong>?
            </p>
            
            <form method="post" class="mt-4">
                {% csrf_token %}
                <div class="d-flex flex-column gap-3">
                    <button type="submit" class="btn btn-danger rounded-pill fw-bold py-2 fs-5" style="background-color: #ff4444 !important; border: none;">
                        Sim, quero apagar
                    </button>
                    <a href="{% url 'playlist_list' %}" class="btn btn-outline-light rounded-pill fw-bold py-2">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
