{% extends 'music/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg p-5 text-center border-0">
            
            <i class="bi bi-exclamation-circle mb-3" style="font-size: 3.5rem; color: #ff4444;"></i>
            
            <h2 class="fw-bold mb-3 text-white">Excluir Álbum</h2>
            
            <p class="mb-2" style="color: #b3b3b3; font-size: 1.1rem;">
                Tem certeza que deseja excluir o álbum
            </p>
            
            <p class="mb-2">
                <strong class="text-white" style="font-size: 1.3rem;">"{{ album.titulo }}"</strong>
            </p>

            <p class="mb-4" style="color: #ff4444; font-size: 0.9rem; opacity: 0.9;">
                <i class="bi bi-info-circle me-1"></i> Esta ação não pode ser desfeita.
            </p>
            
            <form method="POST" class="mt-4">
                {% csrf_token %}
                
                <div class="d-flex flex-column gap-3">
                    <button type="submit" class="btn btn-danger rounded-pill fw-bold py-2 fs-5" style="background-color: #ff4444 !important; border: none;">
                        Sim, excluir
                    </button>
                    <a href="{% url 'album_list' %}" class="btn btn-outline-light rounded-pill fw-bold py-2">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
