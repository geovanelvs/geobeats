{% extends 'music/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center mb-5 mt-4">
    <div class="col-md-6">
        <div class="card shadow-lg p-5 border-0">
            <h3 class="fw-bold text-center mb-4" style="color: #40c4ff;">{{ titulo }}</h3>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-4 text-start">
                    <label class="form-label" style="color: #ffffff; font-weight: 600;">Nome da Playlist:</label>
                    <div class="dark-input-wrapper">
                        {{ form.nome }}
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label class="form-label" style="color: #ffffff; font-weight: 600;">Selecione as Músicas:</label>
                    <div class="p-2" style="max-height: 250px; overflow-y: auto; background-color: #000000; border: 1px solid #282828; border-radius: 8px;">
                        <div class="music-selection-list">
                            {{ form.musicas }}
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 fw-bold mb-3 mt-2" style="border-radius: 25px;">
                    <i class="bi bi-check-circle me-2"></i> Salvar Playlist
                </button>
                
                <a href="{% url 'playlist_list' %}" class="btn-nav-white w-100 text-center d-block text-decoration-none">
                    Voltar para a lista
                </a>
            </form>
        </div>
    </div>
</div>

<style>
    /* Força o estilo do input de texto para o azul claro (caso não tenha a classe form-control no forms.py) */
    input[type="text"] {
        background-color: #e8f0fe !important;
        border: none !important;
        color: #000000 !important;
        border-radius: 8px !important;
        padding: 12px !important;
        width: 100%;
        font-weight: 500;
        outline: none;
    }

    /* Remove as bolinhas da lista gerada pelo Django */
    .music-selection-list ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    /* Estilo de cada linha (Música) */
    .music-selection-list li {
        color: #ffffff;
        padding: 10px 15px;
        border-bottom: 1px solid #1a1a1a;
        display: flex;
        align-items: center;
        transition: background-color 0.2s;
        border-radius: 5px;
    }

    .music-selection-list li:hover {
        background-color: #121212;
    }

    .music-selection-list li:last-child {
        border-bottom: none;
    }

    /* Estilo das Checkboxes */
    .music-selection-list input[type="checkbox"] {
        margin-right: 15px;
        accent-color: #40c4ff; /* Usa o azul do GeoBeats quando selecionado */
        transform: scale(1.3);
        cursor: pointer;
    }

    /* Estilo da Barra de Rolagem da lista de músicas */
    ::-webkit-scrollbar {
        width: 8px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: #282828;
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: #40c4ff; /* Fica azul ao passar o rato na barra */
    }
</style>
{% endblock %}
