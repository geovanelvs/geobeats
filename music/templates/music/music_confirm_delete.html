{% extends 'music/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg p-5 text-center border-0">
            
            <i class="bi bi-exclamation-circle mb-3" style="font-size: 3.5rem; color: #ff4444;"></i>
            
            <h2 class="fw-bold mb-3 text-white">Excluir Música</h2>
            
            <p class="mb-2" style="color: #b3b3b3; font-size: 1.1rem;">
                Tens a certeza que queres apagar esta música?
            </p>
            
            <p class="mb-4">
                <strong class="text-white" style="font-size: 1.3rem;">"{{ musica.titulo }}"</strong><br>
                <span style="color: #b3b3b3; font-size: 0.95rem;">de {{ musica.artista }}</span>
            </p>
            
            <form method="post" class="mt-4">
                {% csrf_token %}
                
                <div class="d-flex flex-column gap-3">
                    <button type="submit" class="btn btn-danger rounded-pill fw-bold py-2 fs-5" style="background-color: #ff4444 !important; border: none;">
                        Sim, apagar
                    </button>
                    <a href="{% url 'music_list' %}" class="btn btn-outline-light rounded-pill fw-bold py-2">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
