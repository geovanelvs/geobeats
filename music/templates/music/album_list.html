{% extends 'music/base.html' %}

{% block content %}
<div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
        <h4 class="m-0">Meus Álbuns</h4>
        <a href="{% url 'album_add' %}" class="btn btn-primary">Adicionar Álbum</a>
    </div>
    
    <div class="table-responsive">
        <table class="table table-hover align-middle m-0">
            <thead class="table-light">
                <tr>
                    <th>Título</th>
                    <th>Artista</th>
                    <th>Ano</th>
                </tr>
            </thead>
            <tbody>
                {% for album in albuns %}
                    <tr>
                        <td><strong>{{ album.titulo }}</strong></td>
                        <td>{{ album.artista }}</td>
                        <td>{{ album.ano }}</td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="3" class="text-center py-4 text-muted">Nenhum álbum cadastrado. Comece por adicionar um!</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
