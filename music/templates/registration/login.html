{% extends 'music/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white text-center py-3">
                <h4 class="m-0">Entrar no GeoBeats</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-2 shadow-sm">Entrar</button>
                </form>

                <hr class="my-4">

                <div class="text-center">
                    <p class="mb-2 text-muted small">Ainda não tem conta?</p>
                    <a href="{% url 'register' %}" class="btn btn-outline-success w-100">Criar Nova Conta</a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    input { 
        display: block; 
        width: 100%; 
        padding: .375rem .75rem; 
        font-size: 1rem; 
        font-weight: 400; 
        line-height: 1.5; 
        color: #212529; 
        background-color: #fff; 
        border: 1px solid #ced4da; 
        border-radius: .375rem; 
        transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
    }
    input:focus {
        border-color: #86b7fe;
        outline: 0;
        box-shadow: 0 0 0 .25rem rgba(13,110,253,.25);
    }
</style>
{% endblock %}
